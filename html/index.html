<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>container machine × docker compose</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 64px auto; padding: 0 16px; line-height: 1.6; }
    pre { background: #f3f3f3; padding: 16px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Hello from container machine</h1>
  <p>このページは VM の中の nginx が返しています。Mac の <code>html/index.html</code> を編集してリロードすると、すぐに反映されます。</p>
  <h2>/api/ の応答(別コンテナ)</h2>
  <pre id="api">loading...</pre>
  <script>
    fetch("/api/").then(r => r.text()).then(t => { document.getElementById("api").textContent = t; })
      .catch(e => { document.getElementById("api").textContent = String(e); });
  </script>
</body>
</html>
