# VM の中の Docker で動くサンプル。
# web(nginx) が静的ページを返し、/api/ を api コンテナへプロキシする。
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Mac 側の ./html を編集すると、そのまま反映される(virtiofs で共有)
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    image: traefik/whoami:v1.10
    restart: unless-stopped
